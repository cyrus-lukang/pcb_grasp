# =============================================================================
# 大板几何与停位配置（单臂 large_single）
# =============================================================================
#
# 板面尺寸（俯视）：
#   宽 width  = 0.27 m （27 cm）—— 垂直于 P2→P3 的那条边
#   长 length = 0.36 m （36 cm）—— P2 与 P3 所在边
#
# 角点约定（与 YOLO / 精定位一致）：
#   P2、P3 = 长度为 36 cm 那条边上的两个角点
#   精定位只更新 P2/P3；停 tip XY = 长方形几何中心
#
# -----------------------------------------------------------------------------
# 已知 P2、P3 + 板宽宽长 → 板心（停 tip XY）
# -----------------------------------------------------------------------------
#
# 1) 边中点 mid23
#      mid = (P2 + P3) / 2
#
# 2) 边单位向量 û = (P3 - P2) / ||P3-P2||
#      期望 ||P3-P2|| ≈ length = 0.36 m
#
# 3) 板内单位法向 n̂（垂直于 P2→P3）
#      候选 n_a = (-û_y, û_x)，n_b = (û_y, -û_x)
#      取指向板内一侧（用粗四角中心相对 mid 的方向判定）
#
# 4) 停 tip XY = 几何板心
#      center = mid + (width / 2) * n̂_inward
#             = mid + 0.135 * n̂_inward
#      ※ 不再使用固定 13 cm 偏移
#
# 5) 停 tip Z
#      stop_z = z_board + stop_z_above_board_m
#      z_board = 精/粗角点 Z 均值；默认 above = 0.10 m
#
# 6) 姿态
#      rx = -90°  ry = +90°
#      rz = rz_parallel(P2→P3) + rz_offset_deg（默认 36.87°）
#
# 主配置 grasp_config.yaml → large_board.width_m / length_m 与本文件一致。
# =============================================================================

board:
  name: large_pcb_27x36
  width_m: 0.27          # 垂直于 P2P3 的边（27 cm）→ 半宽 13.5 cm 到板心
  length_m: 0.36         # P2P3 边（36 cm）
  p2_p3_edge: length
  note: >
    精定位得 P2、P3 后：mid=(P2+P3)/2；
    停 tip XY = mid + (width_m/2) * n̂_板内。

stop:
  # 偏移由 width_m/2 自动算，勿再写固定 offset_m
  use_board_center: true
  z_above_board_m: 0.10
  rx_deg: -90.0
  ry_deg: 90.0
  rz_offset_deg: 36.87
  rz_rule: parallel_p2p3_plus_offset

# -----------------------------------------------------------------------------
# batch_067 核对：center@0.135 相对旧 stop@0.13 差约 5 mm
#   ||P3-P2|| ≈ 359 mm ≈ 360 mm OK
# -----------------------------------------------------------------------------
