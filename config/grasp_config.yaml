# PCB 粗定位(头) + 精定位(腕) 抓取配置
# 本文件只服务 pcb_grasp；权重/标定默认走本仓库相对路径。
# 腕精定位 rz：轮廓 match 方向（YOLO kp 仅作 Chamfer 搜索初值）

models:
  # 粗定位：头鱼眼 YOLO-Pose · 3cls（PCB小板=0 + 空槽nopcb=1 + PCB大板=2）· 20261105
  # run: yolopose_3cls_20261105163435_041ee5 · PCB小板+空槽(nopcb)+PCB大板
  head_pose_weights: /home/ubuntu/workspace/pcb_grasp/models/yolopose/yolopose_3cls_20261105163435_041ee5/best.pt
  # 精定位（小板）：腕部 YOLO-Pose · 江源杯 26x wrist（非昨天 b6aa78）
  # 按头粗 cls 选：small → 本权重；large → large_board.wrist_pose_weights
  wrist_pose_weights: /home/ubuntu/workspace/lk_Perception/calibration/Perceptual_Processing_Platform/models/yolopose/yolopose_wrist_jiangyuan_0827_1613/best.pt
  # 精定位外轮廓模板（关键点定方向 + Chamfer 微调）
  shape_model: TCT/shape_match/models/d435_pcb.npz

# 腕部精定位：pose_outer_refine 同款（P1→P0 定方向，外轮廓匹配出 xyz/rz）
shape_match:
  enable: true
  angle_offset_deg: 0.0
  angle_range_deg: 30.0
  edge_mode: outer-ring
  score_thresh: 5.2

# 同模类别 id（训好大板后只改权重 / 必要时改数字）
classes:
  pcb_small: 0
  nopcb: 1
  pcb_large: 2

# 大板双臂对夹（流程对齐托盘 UI：识别 → 接近外开 → 确认抓取 → 合拢）
# 精 P2/P3 → tip=mid23 后 x+=dx、左 y+=dy、右 y-=dy；rz∥P2→P3。
# 头定位：大板角点深=7 号校正图上的 FFS（7 号走 CAM0 当左目，6 号只作右图）。
# 粗到位=末端在角点XY / grasp_z+15cm（左右统一），姿态垂直向下；腕精按当前相机到 grasp_z 算深度。
large_board:
  enable: true
  # TCP=夹爪 tip：XY/Z 偏移均为 0
  tool_y_m: 0.0
  tool_z_m: 0.0
  # 接近外开；新策略 dx/±dy 已含左右分开，默认 0
  open_margin_m: 0.0
  # 合拢额外内收；建议 0（靠力阈贴实）
  squeeze_close_m: 0.0
  squeeze_velocity_scale: 0.01
  # 阻抗/遇阻停力阈（N）；合拢靠双臂位移，不收夹爪（RIM 暂退化慢速到位）
  squeeze_force_n: 5.0
  use_impedance: true
  # —— 最终夹取高度写死（基座 Z，米）。腕精深度 = 当前相机光心到该平面的光轴距离 ——
  use_left_current_z: false
  grasp_z_below_left_m: 0.0
  grasp_z_m: 0.681
  # tip_span_m：旧字段（左贴边+span）；现接近改用 approach_dx/dy，可留作兼容
  tip_span_m: 0.47
  hover_z_m: null
  approach_velocity_scale: 0.08
  half_width_m: null
  # False：大板角点用头 FFS 深度（不用标定平面）
  use_fixed_grasp_z_plane: false
  # 大板：rz=夹爪中间线∥P2→P3（23⊥03；勿再用 ⊥P0→P3）
  orient_edge: parallel_p2p3
  # 额外 rz 偏置（度），装夹爪偏了可微调
  orient_rz_offset_deg: 0.0
  # 接近 tip（精定位之后）：左=(P3.x+dx, P3.y+dy)；右=(P2.x+dx, P2.y−dy)
  approach_dx_m: 0.15
  approach_dy_m: 0.08
  # —— 高度语义 ——
  # 头粗定位：FFS 角点深度反投影 → 基座 XY（Z 仍写回角点，但不驱动拍腕高度）
  # 粗定位到达（拍腕）：XY=FFS 角点，Z=grasp_z_m+fine_hover（左右统一，现 681+150=831mm）
  # 腕精：深度=当前相机到 grasp_z_m 的光轴距离，反投影角点 XY；夹取 Z=grasp_z_m，XY+=dx/±dy
  fine_enable: true
  # 腕部大板角点：YOLO-Pose · corner · V2 · 220e76（交付版；非 V1·787553）
  # 单角模型：class=corner、kpt_shape=[1,3]、训练 imgsz=480（勿用 detect.wrist_imgsz=960）
  wrist_pose_weights: /home/ubuntu/workspace/lk_Perception/calibration/Perceptual_Processing_Platform/runs/yolopose_corner_20261119152957_220e76/weights/best.pt
  wrist_imgsz: 480
  wrist_n_corners: 1
  fine_hover_height_m: 0.15   # 拍腕 tipZ = grasp_z_m + 本值（左右统一）
  approach_hover_height_m: 0.0  # 精接近 tipZ = grasp_z_m（不再抬高）
  fine_match_max_dist_m: 0.15 # 腕精相对粗角点/板心匹配阈值

  # —— 单臂支路 B（无头；腕粗 → 左精 P2/P3 → 停 mid23）——
  # 平台选 force=large_single 进入；位姿/高度占位，后面你写死
  single_arm:
    enable: true
    # 粗定位前左臂固定法兰 [x,y,z,rx,ry,rz] 米/弧度；null=暂用当前 TCP
    coarse_flange_pose: null
    # 精定位悬停高度（相对板面）；null=复用上面 fine_hover_height_m
    fine_hover_height_m: null
    # 精定位结束后停在 mid(P2,P3) 的相机 Z（基座）；null=后面写死（暂不强制落到固定高）
    stop_z_m: null

calib:
  # 左图=portal cam7，用 CAM0 校正。右图=portal cam6，用 CAM1 校正。视差方向因此反过来，不再水平翻转。
  stereo_calib_json: calib/stereo/stereo_calib_cam6.json
  stereo_maps_yml: ""
  # CAM0 原始鱼眼内参。校正图抬点用 stereo K_rect，不用这份 fx。
  head_intrinsics_yaml: calib/head/head_fisheye_left_s36_intrinsics.yaml
  # 眼在手外：portal cam7 = S36 CAM0（立体左目）→ Link_Base
  # 来源: .../20261123_154818_head_chest_leftwrist/head_fisheye_cam7_CAM0_handeye_from_stereo.yaml
  #        T_base_cam7 = T_base_cam6 @ T_CAM0_to_CAM1（portal6=CAM1, portal7=CAM0）
  T_base_cam:
    - [-0.04338227993342088, -0.23492029566106631, 0.9710460506744822, 0.09907777988592911]
    - [-0.9990438643332097, 0.004931563937512214, -0.04344003668439506, 0.028741888809908425]
    - [0.005416170648118423, -0.9720021267267721, -0.2349096225528239, 1.223828262193451]
    - [0.0, 0.0, 0.0, 1.0]
  # 眼在手上：工具 → 左腕 Gemini305（CV3H7610000L / portal cam1）
  # 来源: .../results/20261110_wrist305_gemini_handeye/left_wrist_1_handeye.yaml
  #        Tsai n=16  transl_rms≈1.79mm  rot_rms≈0.53°  reproj≈0.06px
  T_tool_cam:
    - [0.022507638320603984, -0.9635404908218506, -0.26661419460339364, 0.08453564370919689]
    - [-0.010305485473285414, -0.26689119261767047, 0.9636715665994704, -0.13623085091056364]
    - [-0.9996935546388147, -0.018942382371413824, -0.015936842965480036, 0.009649814255459525]
    - [0.0, 0.0, 0.0, 1.0]
  # 右腕（arm B / cam3）：大板精定位看 P2
  # 来源: calib/handeye/right_wrist_1_handeye.yaml · CV3H761000XG
  T_tool_cam_right:
    - [0.012814399993113179, 0.9647982705560006, 0.26267867877878187, -0.08584363273585255]
    - [0.0003688328139679342, 0.2626956699016061, -0.9648786705992114, 0.1389369718434879]
    - [-0.9999178241811533, 0.012461225746144888, 0.003010438129537496, 0.010925959852390895]
    - [0.0, 0.0, 0.0, 1.0]
  # 左腕 RGB 内参 1280x800 · BROWN_CONRADY_K6（Orbbec EEPROM）
  wrist_intrinsics:
    fx: 615.039856
    fy: 615.071167
    cx: 630.238953
    cy: 401.217224
    # OpenCV: k1,k2,p1,p2,k3,k4,k5,k6
    distortion_coefficients: [-1.30164409, 0.86659974, 0.00031279, -0.00004894, -0.19230975, -1.28480470, 0.84361118, -0.18328477]
  wrist_depth_scale: 0.001   # Gemini305 uint16 mm → m（D405 旧值 0.0001）
  head_fixed_depth_cam_m: 0.85
  # PCB 上表面 base-Z = 夹爪 tip（arm_*_linkTCP）贴板高度；与 motion.grasp_z_m 同源
  # 2026-11-10：末端已改为夹爪尖，不再是法兰；旧值 -0.48 作废
  head_tray_z_m: 0.71548

# 头部深度 = 双目 Fast-FoundationStereo（不是 RealSense）
depth:
  ffs_weights: /home/ubuntu/workspace/pcb_grasp/models/ffs/model_best_bp2_serialize.pth
  ffs_cfg: /home/ubuntu/workspace/pcb_grasp/models/ffs/cfg.yaml

detect:
  head_conf: 0.4
  wrist_conf: 0.5
  kpt_conf: 0.35
  imgsz: 640
  head_imgsz: 480
  wrist_imgsz: 960
  device: 0
  # 2cls 头模：PCB(0)+nopcb(1) 都保留并分配 ID；抓取仍只选最近 PCB
  head_class_ids: null
  kp_i: 0
  kp_j: 1
  # 粗/精均采 N 帧 → MAD 滤异常 → 取最接近平均位置的那一帧真实样本
  n_frames: 10
  outlier_mad_k: 3.0
  frame_gap_s: 0.03

motion:
  # 小板粗定位悬停：相机光心在板上方 hover_height，姿态=腕相机竖直向下（精定位拍摄）
  # 腕精算完后抓取：切到末端竖直向下 (-90°,0)，只变 rz，再降 Z
  hover_height_m: 0.30
  # True：精定位反投影 camZ = hover_height（固定 30cm），不读腕部深度图
  wrist_use_fixed_hover_depth: true
  hover_camera_down: true
  # 走廊高度；大位移时 rim_motion 按 min-j1 柱坐标分段
  # （先抬升→外侧改半径/姿态→最后转 j1→再落目标），减轻底座扫到头部
  safe_z_m: 0.02
  # linkTCP 已是夹爪 tip，不再加法兰→尖端偏置
  tcp_offset: [0.0, 0.0, 0.0]
  tool_rz_offset_rad: 1.57079632679
  # PLAN 线速度 ≈ rim.max_linear_vel * velocity_scale（略加快）
  velocity_scale: 0.35
  cart_vel_mm_s: 60
  cart_acc_mm_s2: 120
  vel_ratio: 25
  acc_ratio: 25
  fine_xy_only: true
  fine_apply_rz: true
  # 已并入 hover_height；保持 0 兼容旧字段
  fine_clear_dy_m: 0.0
  fine_clear_dz_m: 0.0
  fine_descend_dz_m: 0.10   # 仅当未示教 grasp_z 时使用（相对下降）
  grasp_z_file: config/grasp_z.json
  # 相对示教 tip 高度上抬 5mm 再抓（防压板）
  grasp_z_lift_m: 0.01
  # 示教夹取高度（arm_*_linkTCP = 夹爪 tip Z）；2026-11-10 左臂现场
  grasp_z_m: 0.71548
  # 多板：粗定位按到基座 XY 距离赋 ID（1=最近）；优先抓 ID=此值
  # 腕侧匹配不到该 ID 时，回退到腕部实际识别到的板（只抓能认出的）
  target_board_id: 2
  board_match_max_dist_m: 0.12
  dry_run: true
  # IK preferred seed：用 POC 左等待位（自然肘型），勿用拧巴的 ready
  ready_joints_A: [63.707, 88.581, -4.036, -94.341, -63.993, 6.160, -86.607]
  # 动完 → 等静止 → 再识别/收夹；到位后约 1s 再抓
  settle_s: 1.0
  still_pos_tol_m: 0.0015
  still_rot_tol_rad: 0.015
  still_hold_s: 0.15
  still_timeout_s: 3.0

# 运控：rim = 定位算完位姿后调用 perception CLI（pcb_grasp 不做路径规划）
#   source ~/workspace/perception/.venv-sdk/bin/activate
#   cd .../perception/projects/yuantu/pipelines
#   python -m rim_python.move_to_pose --arm left|right --pose x,y,z,r,p,y --execute
#       tj  = 旧 TJ_demo（仅兼容）
motion_backend: rim

rim:
  frame_bundle: "10.3.8.7:50066"
  mc: ""   # 空=同主机 :50061
  connect_timeout_s: 10
  plan_timeout_s: 120
  # 仅作读数/兼容字段；实际速度由 move_to_pose CLI / MC 默认决定
  max_linear_vel: 0.06
  max_angular_vel: 0.25

tj_demo:
  robot_ip: "192.168.1.190"
  arm: "A"
  use_impedance: true
  contact_threshold_n: 10.0
  # 知行夹爪：对齐 rimbot_poc/config/robot_config.json end_effector
  gripper:
    # rim_python 开度：0=全闭 1=全开；收夹用 0.4（略留缝夹板）
    grasp_position: 0.4
    release_position: 1.0
    speed: 50
    torque_grasp: 30
    torque_release: 60
    com_ch: 2

cameras:
  # portal/bundle = rim frame_bundle（默认 rim.frame_bundle=10.3.8.7:50066）
  #   注：8787 watch 页能看流，但 WS 目前不推 sample，故 pcb_grasp 改走 50066
  # v4l2 = 本机 /dev/video*（机柜旁直连 S36 时用）
  head_source: portal
  portal: "10.3.8.7:8787"      # 仅作旧字段保留；实际取流用 rim.frame_bundle
  # 主相机 / FFS 左目 = 7。6 只作为立体右图，不再做手眼和定位参考。
  portal_head_left_id: 7
  portal_head_right_id: 6
  portal_max_hz: 8
  portal_timeout_s: 60
  head_left: /dev/video7
  head_right: /dev/video6
  head_width: 1920
  head_height: 1536
  s36_sdk: /home/ubuntu/workspace/ccg3_8m_sdk/ccg3_camera_python
  # 腕部：左臂彩色 cam1 / 深度 cam0，右臂彩色 cam3 / 深度 cam2；d405=本机 RealSense
  wrist_source: portal
  portal_wrist_id: 1            # 左腕 CV3H7610000L
  portal_wrist_depth_id: 0      # 左腕 Z16
  portal_wrist_right_id: 3      # 右腕 CV3H761000XG
  portal_wrist_right_depth_id: 2
  wrist_need_depth: true
  wrist_undistort: true        # 305 畸变大，精定位前去畸变
  wrist_serial: "262422274334" # 仅 wrist_source=d405
  wrist_width: 1280
  wrist_height: 800
  wrist_fps: 30
