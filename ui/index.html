<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>pcb_grasp 抓取控制台</title>
  <style>
    :root { --bg:#12141a; --card:#1c2030; --fg:#e8ecf4; --muted:#9aa3b5; --ok:#3ddc97; --err:#ff6b6b; --amber:#f0b429; --blue:#3a86ff; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "IBM Plex Sans", "Noto Sans SC", sans-serif; background: var(--bg); color: var(--fg); }
    main { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }
    h1 { font-size: 1.45rem; margin: 0 0 6px; }
    .lead { color: var(--muted); margin: 0 0 18px; line-height: 1.45; }
    .card { background: var(--card); border-radius: 12px; padding: 18px; margin-bottom: 14px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
    select { width: 100%; border: 1px solid #2c3348; border-radius: 8px; background: #0f121a; color: var(--fg); padding: 8px 10px; }
    .check { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.9rem; margin-top: 18px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    button { border: 0; border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer; background: var(--blue); color: #fff; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #estop { background: var(--err); }
    #plan { background: var(--amber); color: #1a1400; }
    #run { background: var(--ok); color: #062a1c; }
    #connect-cam, #connect-robot { background: #445; }
    #confirm-yes { background: var(--ok); color: #062a1c; }
    #confirm-no { background: var(--err); }
    pre { background: #0f121a; border-radius: 8px; padding: 12px; overflow: auto; font-size: 0.78rem; max-height: 280px; margin: 0; }
    #status { margin-top: 10px; min-height: 1.3em; }
    #status.ok { color: var(--ok); }
    #status.err { color: var(--err); }
    #status.run { color: var(--amber); }
    .hint { font-size: 0.85rem; color: var(--muted); margin: 0; }
    .banner {
      border-radius: 10px; padding: 12px 14px; margin-bottom: 10px;
      font-size: 0.92rem; line-height: 1.4; border: 1px solid #2c3348;
    }
    .banner.connecting { background: #2a2410; color: var(--amber); border-color: #5a4a18; }
    .banner.ok { background: #0f2a1c; color: var(--ok); border-color: #1e5a3a; }
    .banner.err { background: #2a1216; color: var(--err); border-color: #6a2a32; }
    #confirm-banner {
      display: none; border-radius: 10px; padding: 14px; margin-bottom: 14px;
      background: #2a2410; border: 1px solid #5a4a18; color: var(--amber);
    }
    #confirm-banner.show { display: block; }
    #confirm-banner h2 { margin: 0 0 8px; font-size: 1.05rem; color: var(--fg); }
    #confirm-banner .actions { margin-top: 10px; }
    .vis-wrap { position: relative; background: #0a0c12; border-radius: 10px; overflow: hidden; min-height: 220px; }
    .vis-wrap img { display: block; width: 100%; height: auto; max-height: 560px; object-fit: contain; background: #000; }
    .vis-meta { margin-top: 8px; font-size: 0.82rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>pcb_grasp 抓取控制台</h1>
    <p class="lead">大板双臂：头FFS深度反投影角点XY → 粗到位=该XY / Z=角点Z+15cm（末端朝下）拍腕 → 腕精用当前相机到 grasp_z 深度得精XY → tip=精XY+dx/±dy、tipZ=grasp_z。复位=本轮作业起点。</p>

    <div id="camera-banner" class="banner connecting">正在连接相机…</div>
    <div id="robot-banner" class="banner err">机械臂未连接（只定位可不连）</div>

    <div id="confirm-banner">
      <h2>大板双臂 · 内收夹近</h2>
      <p id="confirm-text">—</p>
      <div class="actions">
        <button id="confirm-inward" type="button">内收 5mm</button>
        <button id="confirm-no" type="button">结束</button>
      </div>
    </div>

    <section class="card">
      <label id="head-label">头部 / 规划图</label>
      <div class="vis-wrap">
        <img id="head-vis" alt="head camera" />
      </div>
      <p class="vis-meta" id="vis-meta">等待相机…</p>
    </section>
    <section class="card">
      <label>腕部相机</label>
      <div class="vis-wrap">
        <img id="wrist-vis" alt="wrist camera" />
      </div>
      <p class="vis-meta" id="wrist-meta">腕部识别图（单臂大板：粗定位腕图叠点）</p>
    </section>

    <section class="card">
      <div class="grid">
        <div>
          <label for="force">流程 / 类别</label>
          <select id="force">
            <option value="auto">auto（头粗 cls：小板/大板双臂）</option>
            <option value="small">小板</option>
            <option value="large">大板双臂</option>
            <option value="large_single">大板单臂（腕粗，无头）</option>
          </select>
        </div>
        <div class="check">
          <input id="grasp" type="checkbox" checked />
          <label for="grasp" style="margin:0">全流程时收夹 / 大板双臂允许内收会话</label>
        </div>
      </div>
      <div class="actions">
        <button id="connect-cam" type="button">连接相机</button>
        <button id="connect-robot" type="button">连接机械臂</button>
        <button id="plan" type="button">只定位</button>
        <button id="run" type="button">全流程</button>
        <button id="session-home" type="button">复位</button>
        <button id="inward" type="button">内收 5mm</button>
        <button id="inward-end" type="button">结束内收</button>
        <button id="reload" type="button">重载配置</button>
        <button id="estop" type="button">急停</button>
      </div>
      <p class="hint" id="hint">加载配置…</p>
      <div id="status"></div>
    </section>

    <section class="card">
      <label>move_to_pose 命令（末端 xyzrpy=mm,deg）</label>
      <pre id="pose-xy">点「只定位」或「全流程」后打印…</pre>
    </section>

    <section class="card">
      <label>定位结果 · 基座 XY</label>
      <pre id="plan-xy">—</pre>
    </section>

    <section class="card">
      <label>最近结果</label>
      <pre id="out">—</pre>
    </section>
  </main>
  <script>
    const out = document.getElementById("out");
    const planXy = document.getElementById("plan-xy");
    const poseXy = document.getElementById("pose-xy");
    const statusEl = document.getElementById("status");
    const camBanner = document.getElementById("camera-banner");
    const robotBanner = document.getElementById("robot-banner");
    const confirmBanner = document.getElementById("confirm-banner");
    const confirmText = document.getElementById("confirm-text");
    const headVis = document.getElementById("head-vis");
    const wristVis = document.getElementById("wrist-vis");
    const visMeta = document.getElementById("vis-meta");
    const wristMeta = document.getElementById("wrist-meta");
    const planBtn = document.getElementById("plan");
    const runBtn = document.getElementById("run");
    let pollTimer = null;
    let statusPoll = null;
    let previewTimer = null;
    let robotConnected = false;
    let cameraConnected = false;
    let awaitingConfirm = false;
    let showPlanImage = false;

    function setStatus(text, kind) {
      statusEl.textContent = text || "";
      statusEl.className = kind || "";
    }
    function setBusy(busy) {
      [planBtn, runBtn].forEach((b) => { if (b) b.disabled = !!busy; });
    }
    function renderCamera(cam) {
      if (!cam) {
        camBanner.className = "banner err";
        camBanner.textContent = "相机未连接";
        cameraConnected = false;
        return;
      }
      if (cam.connecting) {
        camBanner.className = "banner connecting";
        camBanner.textContent = "正在连接相机…";
        cameraConnected = false;
        return;
      }
      if (cam.connected) {
        camBanner.className = "banner ok";
        camBanner.textContent = `相机已连接（${cam.mode || "head"}）`;
        cameraConnected = true;
        return;
      }
      camBanner.className = "banner err";
      camBanner.textContent = "相机未连接" + (cam.error ? `：${cam.error}` : "");
      cameraConnected = false;
    }
    function renderRobot(robot) {
      if (!robot) {
        robotBanner.className = "banner err";
        robotBanner.textContent = "机械臂未连接（只定位可不连）";
        robotConnected = false;
        return;
      }
      if (robot.connecting) {
        robotBanner.className = "banner connecting";
        robotBanner.textContent = `正在连接机械臂 ${robot.ip || ""}…`;
        robotConnected = false;
        return;
      }
      if (robot.connected) {
        robotBanner.className = "banner ok";
        robotBanner.textContent = `机械臂已连接 ${robot.ip || ""}`;
        robotConnected = true;
        return;
      }
      robotBanner.className = "banner err";
      robotBanner.textContent = "机械臂未连接" + (robot.error ? `：${robot.error}` : "");
      robotConnected = false;
    }
    function renderConfirm(s) {
      awaitingConfirm = !!(s && s.awaiting_confirm);
      if (awaitingConfirm) {
        confirmBanner.classList.add("show");
        confirmText.textContent = s.confirm_message || "大板双臂已到接近位，可内收";
      } else {
        confirmBanner.classList.remove("show");
      }
    }
    async function getJSON(path) {
      const res = await fetch(path);
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }
    async function post(path, body) {
      const res = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {}),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.ok === false) {
        throw new Error(data.error || data.message || res.statusText);
      }
      return data;
    }
    async function refreshPreview() {
      if (showPlanImage || awaitingConfirm) return;
      headVis.src = "/api/head.jpg?t=" + Date.now();
      if (wristVis) wristVis.src = "/api/wrist.jpg?t=" + Date.now();
      visMeta.textContent = "实时预览 " + new Date().toLocaleTimeString();
    }
    function stopPoll() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }
    function flangeToMmDeg(h) {
      if (!h || h.length < 6) return null;
      return [
        Number(h[0]) * 1000, Number(h[1]) * 1000, Number(h[2]) * 1000,
        Number(h[3]) * 180 / Math.PI, Number(h[4]) * 180 / Math.PI, Number(h[5]) * 180 / Math.PI,
      ];
    }
    function poseCsv(arr) {
      if (!arr || arr.length < 6) return null;
      return arr.map((v) => Number(v).toFixed(4)).join(",");
    }
    function cliLine(arm, arr) {
      const csv = poseCsv(arr);
      if (!csv) return "—";
      return `python -m rim_python.move_to_pose --arm ${arm || "left"} --pose ${csv} --execute --allow-large`;
    }
    function fmtXY(xy) {
      if (!xy || xy.length < 2) return "—";
      return `(${Number(xy[0]).toFixed(4)}, ${Number(xy[1]).toFixed(4)})`;
    }
    function renderPoseXy(result) {
      if (!poseXy || !result) return;
      const mode = result.grasp_mode || "?";
      const cli = result.cli || {};
      if (mode === "large") {
        const cL = result.coarse_left_xyzrpy_mm_deg || flangeToMmDeg(result.coarse_left);
        const cR = result.coarse_right_xyzrpy_mm_deg || flangeToMmDeg(result.coarse_right);
        const lg = result.left_grasp_xyzrpy_mm_deg || flangeToMmDeg(result.left_grasp);
        const rg = result.right_grasp_xyzrpy_mm_deg || flangeToMmDeg(result.right_grasp);
        const curL = result.current_xyzrpy_mm_deg || flangeToMmDeg(result.current_flange);
        const curR = result.current_right_xyzrpy_mm_deg || flangeToMmDeg(result.current_flange_right);
        poseXy.textContent = [
          `grasp_mode=large  ID=${result.target_board_id ?? "—"}`,
          ``,
          `# 当前左/右`,
          cli.current_left || cliLine("left", curL),
          cli.current_right || cliLine("right", curR),
          ``,
          `# 接近（粗定位）`,
          cliLine("left", cL),
          cliLine("right", cR),
          ``,
          `# tip（精定位）`,
          cli.left_grasp || cliLine("left", lg),
          cli.right_grasp || cliLine("right", rg),
        ].join("\n");
        return;
      }
      if (mode === "large_single") {
        const curL = result.current_xyzrpy_mm_deg || flangeToMmDeg(result.current_flange);
        const stop = result.fine_xyzrpy_mm_deg || flangeToMmDeg(result.fine_flange);
        poseXy.textContent = [
          `grasp_mode=large_single  ID=${result.target_board_id ?? "—"}  （腕粗，无头）`,
          ``,
          `# 当前左臂`,
          cli.current_left || cli.current || cliLine("left", curL),
          ``,
          `# 停 mid23`,
          cli.fine || cliLine("left", stop),
        ].join("\n");
        return;
      }
      const arm = cli.arm || "left";
      const curL = result.current_xyzrpy_mm_deg || flangeToMmDeg(result.current_flange);
      const coarse = result.coarse_xyzrpy_mm_deg || flangeToMmDeg(result.hover_flange);
      const fine = result.fine_xyzrpy_mm_deg || flangeToMmDeg(result.fine_flange);
      poseXy.textContent = [
        `grasp_mode=${mode}  ID=${result.target_board_id ?? "—"}  arm=${arm}`,
        ``,
        `# 当前`,
        cli.current || cliLine(arm, curL),
        `# 粗悬停`,
        cli.coarse || cliLine(arm, coarse),
        `# 精 / 抓取高`,
        cli.fine || cliLine(arm, fine),
      ].join("\n");
    }
    function renderPlanXy(result) {
      if (!planXy || !result) return;
      renderPoseXy(result);
      const dbg = result.debug || {};
      const print = dbg.print_xy || (dbg.plan ? {
        mid_mode: dbg.plan.mid_mode,
        p0_xy: dbg.plan.p0_xy,
        p2_xy: dbg.plan.p2_xy,
        p3_xy: dbg.plan.p3_xy,
        tip_left_xy: dbg.plan.tip_left_xy,
        tip_right_xy: dbg.plan.tip_right_xy,
        grasp_z_m: dbg.plan.grasp_z_m,
      } : null);
      if (!print) {
        planXy.textContent = result.coarse
          ? `grasp_mode=${result.grasp_mode || "?"}\ncoarse_xy=(${Number(result.coarse.xyz[0]).toFixed(4)}, ${Number(result.coarse.xyz[1]).toFixed(4)})`
          : "—";
        return;
      }
      const z = print.grasp_z_m != null ? Number(print.grasp_z_m).toFixed(4) : "?";
      planXy.textContent =
        `mid_mode=${print.mid_mode || "?"}\n` +
        (print.p2_xy ? `P2_xy = ${fmtXY(print.p2_xy)}\n` : "") +
        (print.p3_xy ? `P3_xy = ${fmtXY(print.p3_xy)}\n` : "") +
        (print.p0_xy ? `P0_xy = ${fmtXY(print.p0_xy)}\n` : "") +
        `tipL_xy = ${fmtXY(print.tip_left_xy)}\n` +
        (print.tip_right_xy ? `tipR_xy = ${fmtXY(print.tip_right_xy)}\n` : "") +
        `grasp_z = ${z} m`;
    }

    async function pollJob() {
      const s = await getJSON("/api/status");
      if (s.camera) renderCamera(s.camera);
      if (s.robot) renderRobot(s.robot);
      renderConfirm(s);
      if (s.running) {
        setBusy(true);
        if (s.result) {
          out.textContent = JSON.stringify(s.result, null, 2);
          renderPlanXy(s.result);
        }
        if (!s.awaiting_confirm) setStatus("运行中… " + (s.message || s.batch_dir || ""), "run");
        else setStatus(s.confirm_message || "大板可内收…", "run");
        if (s.has_wrist_vis && wristVis) {
          wristVis.src = "/api/wrist.jpg?t=" + Date.now();
          if (wristMeta) wristMeta.textContent = "腕部 " + new Date().toLocaleTimeString();
        }
        return;
      }
      stopPoll();
      setBusy(false);
      renderConfirm(s);
      if (s.result) {
        out.textContent = JSON.stringify(s.result, null, 2);
        renderPlanXy(s.result);
        if (s.result.debug && s.result.debug.stage === "plan_only") {
          showPlanImage = true;
          headVis.src = "/api/confirm.jpg?t=" + Date.now();
          visMeta.textContent = "定位结果图（即将恢复预览）";
          if (wristVis) wristVis.src = "/api/wrist.jpg?t=" + Date.now();
          setTimeout(() => { showPlanImage = false; }, 4000);
        }
      }
      if (s.ok === true) setStatus(s.message || "完成", "ok");
      else if (s.ok === false) setStatus(s.message || s.error || "失败", "err");
    }

    async function startJob(body, statusText) {
      if (!cameraConnected) {
        setStatus("请先「连接相机」", "err");
        return;
      }
      showPlanImage = false;
      const force = document.getElementById("force").value;
      await post("/api/run", {
        force_class: force === "auto" ? null : force,
        do_grasp: document.getElementById("grasp").checked,
        confirm_large: true,
        ...body,
      });
      setBusy(true);
      setStatus(statusText, "run");
      stopPoll();
      pollTimer = setInterval(pollJob, 700);
      pollJob();
    }

    document.getElementById("plan").onclick = async () => {
      try {
        await startJob(
          { plan_only: true, real: false, stage: "all" },
          "只定位中（不动臂）…"
        );
      } catch (e) { setStatus(e.message, "err"); }
    };
    document.getElementById("run").onclick = async () => {
      try {
        if (!robotConnected) {
          setStatus("全流程请先「连接机械臂」", "err");
          return;
        }
        const force = document.getElementById("force").value;
        const msg = force === "large_single"
          ? "全流程·单臂：腕粗 → 精 P2/P3 → 停 mid23…"
          : force === "large"
            ? "全流程·双臂：头粗 → 腕精 → 接近 mid23+dx/±dy…"
            : "全流程…";
        await startJob({ plan_only: false, real: true, stage: "all" }, msg);
      } catch (e) { setStatus(e.message, "err"); }
    };
    async function doInward() {
      try {
        const data = await post("/api/inward", {});
        setStatus(data.message || `内收 ×${data.n}`, data.ok ? "ok" : "err");
        pollJob();
      } catch (e) { setStatus(e.message, "err"); }
    }
    async function sendConfirmEnd() {
      try {
        const data = await post("/api/confirm", { ok: false });
        setStatus(data.message || "已结束内收会话", "ok");
        confirmBanner.classList.remove("show");
        awaitingConfirm = false;
      } catch (e) { setStatus(e.message, "err"); }
    }
    document.getElementById("confirm-inward").onclick = () => doInward();
    document.getElementById("confirm-no").onclick = () => sendConfirmEnd();
    document.getElementById("inward").onclick = () => doInward();
    document.getElementById("inward-end").onclick = () => sendConfirmEnd();

    document.getElementById("connect-cam").onclick = async () => {
      try {
        camBanner.className = "banner connecting";
        camBanner.textContent = "正在连接相机…";
        const data = await post("/api/connect_camera", {});
        renderCamera(data.camera);
        setStatus(data.message || "", data.camera && data.camera.connected ? "ok" : "err");
        if (data.camera && data.camera.connected) {
          showPlanImage = false;
          refreshPreview();
        }
      } catch (e) {
        renderCamera({ connected: false, connecting: false, error: e.message });
        setStatus(e.message, "err");
      }
    };
    document.getElementById("connect-robot").onclick = async () => {
      try {
        robotBanner.className = "banner connecting";
        robotBanner.textContent = "正在连接机械臂…";
        setStatus("正在连接机械臂…", "run");
        const data = await post("/api/connect", {});
        renderRobot(data.robot);
        setStatus(data.message || "", data.robot && data.robot.connected ? "ok" : "err");
      } catch (e) {
        renderRobot({ connected: false, connecting: false, error: e.message });
        setStatus(e.message, "err");
      }
    };
    document.getElementById("reload").onclick = async () => {
      try {
        await post("/api/reload_config", {});
        const c = await getJSON("/api/config");
        if (c.camera) renderCamera(c.camera);
        if (c.robot) renderRobot(c.robot);
        document.getElementById("hint").textContent =
          `cls 小板=${c.classes.pcb_small} nopcb=${c.classes.nopcb} 大板=${c.classes.pcb_large}；` +
          `grasp_z=${c.grasp_z_m ?? "未示教"}；robot_ip=${c.robot_ip}`;
        setStatus("配置已重载", "ok");
      } catch (e) { setStatus(e.message, "err"); }
    };
    document.getElementById("session-home").onclick = async () => {
      try {
        if (!robotConnected) {
          setStatus("请先「连接机械臂」", "err");
          return;
        }
        setStatus("复位到作业起点…", "run");
        const data = await post("/api/session_home", { action: "go" });
        setStatus(data.message || "已复位", data.ok === false ? "err" : "ok");
        confirmBanner.classList.remove("show");
        awaitingConfirm = false;
        showPlanImage = false;
        out.textContent = "—";
        if (planXy) planXy.textContent = "—";
        if (poseXy) poseXy.textContent = "点「只定位」或「全流程」后打印…";
        refreshPreview();
      } catch (e) { setStatus(e.message, "err"); }
    };
    document.getElementById("estop").onclick = async () => {
      try {
        await post("/api/estop", {});
        setStatus("已急停", "err");
        confirmBanner.classList.remove("show");
        awaitingConfirm = false;
      } catch (e) { setStatus(e.message, "err"); }
    };

    document.getElementById("reload").click();
    statusPoll = setInterval(async () => {
      try {
        const s = await getJSON("/api/status");
        if (s.camera) renderCamera(s.camera);
        if (s.robot) renderRobot(s.robot);
        if (!pollTimer) renderConfirm(s);
      } catch (_) {}
    }, 1200);
    previewTimer = setInterval(refreshPreview, 2500);
  </script>
